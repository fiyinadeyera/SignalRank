<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Rank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-in {
            animation: slideIn 0.4s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-5xl font-bold text-white mb-2">Signal Rank</h1>
                <p class="text-lg text-slate-400">Find events that match your specific goals</p>
            </div>

            <!-- Main Card -->
            <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                <div class="p-8 md:p-12">
                    <!-- Form -->
                    <form id="goalForm" class="space-y-6">
                        <!-- Goals Input -->
                        <div>
                            <label for="goals" class="block text-sm font-semibold text-slate-200 mb-3">What are you looking for?</label>
                            <textarea
                                id="goals"
                                placeholder="career networking, comedy shows, product launches, jam sessions..."
                                class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none"
                                rows="4"
                            ></textarea>
                        </div>

                        <!-- Date Filters -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-200 mb-3">When</label>
                            <div class="flex gap-3">
                                <button type="button" class="filter-btn flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg font-medium active data-filter='this-week' hover:bg-blue-700 transition">This Week</button>
                                <button type="button" class="filter-btn flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-medium hover:bg-slate-600 transition data-filter='today'">Today</button>
                                <button type="button" class="filter-btn flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-medium hover:bg-slate-600 transition data-filter='next-week'">Next Week</button>
                            </div>
                            <input type="hidden" id="dateFilter" value="this-week">
                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg transition transform hover:scale-105 active:scale-95 shadow-lg"
                        >
                            Find Events
                        </button>
                    </form>

                    <!-- Error -->
                    <div id="error" class="hidden mt-6 p-4 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm"></div>

                    <!-- Loading -->
                    <div id="loading" class="hidden mt-8 text-center">
                        <div class="spinner w-10 h-10 border-4 border-slate-600 border-t-blue-500 rounded-full mx-auto mb-3"></div>
                        <p class="text-slate-400">Ranking events for you...</p>
                    </div>

                    <!-- Results -->
                    <div id="result" class="hidden mt-8 space-y-4">
                        <h2 class="text-2xl font-bold text-white">Your Rankings</h2>
                        <div class="space-y-3" id="resultContent"></div>
                        <div id="infoBadge" class="mt-6 inline-block px-4 py-2 bg-blue-600/20 border border-blue-500 text-blue-300 rounded-lg text-sm font-medium"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function parseResults(text) {
            const events = [];
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);

            let currentEvent = null;
            let skipUntilFirstEvent = true;

            for (const line of lines) {
                if (line.startsWith('Score:')) {
                    if (currentEvent) {
                        const scoreMatch = line.match(/Score:\s*(\d+)\/10\s*\|\s*(FREE|PAID)/i);
                        if (scoreMatch) {
                            currentEvent.score = scoreMatch[1] + '/10';
                            currentEvent.isPaid = scoreMatch[2].toUpperCase() === 'PAID';
                            events.push(currentEvent);
                            skipUntilFirstEvent = false;
                        }
                    }
                    currentEvent = null;
                } else if (skipUntilFirstEvent && !line.match(/^[A-Z]/)) {
                    continue;
                } else if (line.startsWith('REASON:')) {
                    if (currentEvent) {
                        currentEvent.reason = line.replace('REASON:', '').trim();
                    }
                } else if (currentEvent === null && line && !line.includes('Score:')) {
                    currentEvent = { name: line, description: '', reason: '', score: '?/10', isPaid: false };
                } else if (currentEvent && !line.startsWith('Score:') && !line.startsWith('REASON:') && line) {
                    if (currentEvent.description) {
                        currentEvent.description += ' ' + line;
                    } else {
                        currentEvent.description = line;
                    }
                }
            }

            return events.slice(0, 6);
        }

        // Handle filter button clicks
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                document.querySelectorAll(".filter-btn").forEach(b => {
                    b.classList.remove("bg-blue-600", "text-white");
                    b.classList.add("bg-slate-700", "text-slate-300");
                });
                btn.classList.remove("bg-slate-700", "text-slate-300");
                btn.classList.add("bg-blue-600", "text-white");
                document.getElementById("dateFilter").value = btn.getAttribute("data-filter");
            });
        });

        document.getElementById("goalForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const goals = document.getElementById("goals").value.trim();
            const dateFilter = document.getElementById("dateFilter").value;

            if (!goals) {
                showError("Please enter what you're looking for");
                return;
            }

            showLoading(true);
            showError("");

            try {
                const response = await fetch("/api/optimize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ goals, dateFilter })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || "Something went wrong");
                    showLoading(false);
                    return;
                }

                const rankedEvents = parseResults(data.ranking);
                const allEvents = data.events || [];
                const savedEvents = JSON.parse(localStorage.getItem('savedEvents') || '{}');

                const cardsHtml = rankedEvents.map((event, index) => {
                    const scoreNum = parseInt(event.score);
                    let scoreBg = 'bg-orange-900/30 text-orange-300';
                    if (scoreNum >= 8) scoreBg = 'bg-green-900/30 text-green-300';
                    else if (scoreNum >= 6) scoreBg = 'bg-blue-900/30 text-blue-300';

                    const fullEvent = allEvents.find(e => e.name.toLowerCase() === event.name.toLowerCase());
                    const eventUrl = fullEvent?.url || '';
                    const eventTime = fullEvent?.start || '';
                    const eventId = event.name;

                    let timeStr = '';
                    if (eventTime) {
                        const parts = eventTime.split(' ');
                        timeStr = parts.length > 1 ? parts[1] : parts[0];
                    }

                    const isSaved = savedEvents[eventId] ? true : false;

                    return `
                        <div class="bg-slate-700/30 border border-slate-600 rounded-xl p-4 hover:bg-slate-700/50 transition">
                            <div class="flex gap-4">
                                <div class="text-2xl font-bold text-blue-400 flex-shrink-0 w-8">${index + 1}</div>
                                <div class="flex-1">
                                    <div class="flex justify-between items-start gap-2 mb-2">
                                        <h3 class="font-semibold text-white text-base">${escapeHtml(event.name)}</h3>
                                        <button class="save-btn text-xl flex-shrink-0 transition ${isSaved ? 'text-red-400' : 'text-slate-500 hover:text-blue-400'}" data-event-id="${escapeHtml(eventId)}" title="${isSaved ? 'Remove from favorites' : 'Save to favorites'}">
                                            ♥
                                        </button>
                                    </div>
                                    ${event.reason ? `<div class="text-sm text-blue-300 mb-2">Matches: ${escapeHtml(event.reason)}</div>` : ''}
                                    ${event.description ? `<p class="text-sm text-slate-400 mb-3">${escapeHtml(event.description)}</p>` : ''}
                                    <div class="flex items-center gap-3 flex-wrap">
                                        <span class="px-2 py-1 rounded ${scoreBg} text-xs font-semibold">${event.score}</span>
                                        <span class="text-xs font-semibold ${event.isPaid ? 'text-amber-400' : 'text-emerald-400'}">
                                            ${event.isPaid ? 'PAID' : 'FREE'}
                                        </span>
                                        ${timeStr ? `<span class="text-xs text-slate-500">${timeStr}</span>` : ''}
                                        ${eventUrl ? `<a href="${eventUrl}" target="_blank" class="text-xs text-blue-400 hover:text-blue-300 transition ml-auto">Register →</a>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById("resultContent").innerHTML = cardsHtml;
                document.getElementById("infoBadge").textContent =
                    data.is_live
                        ? `✓ Live events (${data.event_count} found)`
                        : `Sample events (add API keys for live events)`;

                const resultEl = document.getElementById("result");
                resultEl.classList.remove("hidden");
                resultEl.classList.add("slide-in");

                document.querySelectorAll('.save-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const eventId = btn.getAttribute('data-event-id');
                        const saved = JSON.parse(localStorage.getItem('savedEvents') || '{}');

                        if (saved[eventId]) {
                            delete saved[eventId];
                            btn.classList.remove('text-red-400');
                            btn.classList.add('text-slate-500');
                        } else {
                            saved[eventId] = true;
                            btn.classList.remove('text-slate-500');
                            btn.classList.add('text-red-400');
                        }

                        localStorage.setItem('savedEvents', JSON.stringify(saved));
                    });
                });

                showLoading(false);
            } catch (error) {
                showError("Error: " + error.message);
                showLoading(false);
            }
        });

        function showLoading(show) {
            document.getElementById("loading").classList.toggle("hidden", !show);
        }

        function showError(message) {
            const error = document.getElementById("error");
            if (message) {
                error.textContent = message;
                error.classList.remove("hidden");
            } else {
                error.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
