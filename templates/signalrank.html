{% extends "base.html" %}

{% block title %}SignalRank — fiyin{% endblock %}

{% block head_extra %}
<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(147, 197, 253, 0.55); }
        50% { box-shadow: 0 0 0 10px rgba(147, 197, 253, 0); }
    }
    .mic-listening { animation: pulseGlow 1.3s ease-in-out infinite; }
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.4s ease; }
    .fade-in  { animation: slideIn 0.25s ease; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(37,99,235,0.16),_transparent_45%),radial-gradient(circle_at_70%_10%,_rgba(168,85,247,0.14),_transparent_38%)]">
    <div class="mx-auto w-full max-w-3xl px-4 py-8 md:py-12">
        <div class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-semibold text-white mb-2">SignalRank</h1>
            <p class="text-sm text-slate-400">Find events that match your goals</p>
        </div>

        <div class="bg-slate-900/75 backdrop-blur-xl border border-slate-700/80 rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 md:p-8">
                <form id="goalForm" class="space-y-4">
                    <div>
                        <div class="flex flex-col gap-2 mb-3 md:flex-row md:items-center md:justify-between">
                            <label for="goals" class="block text-sm font-semibold text-slate-100">Describe your goal</label>
                            <div class="flex flex-wrap gap-1.5 justify-start md:justify-end" id="goalPresets">
                                <button type="button" class="preset-chip px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 transition" data-text="networking events">Networking</button>
                                <button type="button" class="preset-chip px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 transition" data-text="comedy shows">Comedy</button>
                                <button type="button" class="preset-chip px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 transition" data-text="product launches">Product</button>
                            </div>
                        </div>
                        <div class="relative">
                            <textarea
                                id="goals"
                                placeholder="Example: I want founder networking events and product meetups this week"
                                class="w-full px-4 py-3 pr-24 pb-12 bg-slate-800/80 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition resize-none"
                                rows="3"
                            ></textarea>
                            <div class="absolute right-3 bottom-3 flex gap-2">
                                <button id="clearBtn" type="button" class="p-2 rounded-lg bg-slate-700 text-slate-200 hover:bg-slate-600 border border-slate-500/70 transition disabled:opacity-30 disabled:cursor-not-allowed" title="Clear input" aria-label="Clear goals">✕</button>
                                <button id="voiceBtn" type="button" class="p-2 rounded-lg bg-slate-700 text-slate-200 hover:bg-slate-600 border border-slate-500/70 transition disabled:opacity-50 disabled:cursor-not-allowed" title="Dictate goals" aria-label="Dictate goals with microphone">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true">
                                        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                                        <path d="M5.5 10.5a6.5 6.5 0 1 0 13 0"></path>
                                        <path d="M12 17v4"></path>
                                        <path d="M9 21h6"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 mt-1" id="charCount"></div>
                    </div>

                    <button id="submitBtn" type="submit" class="w-full py-2.5 text-sm bg-gradient-to-r from-blue-100 to-sky-100 hover:from-blue-50 hover:to-sky-50 text-slate-900 font-semibold rounded-lg transition transform hover:scale-[1.01] active:scale-[0.99] shadow-md shadow-blue-900/20 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                        Find Events
                    </button>

                    <div class="grid grid-cols-1 md:grid-cols-[auto,1fr] gap-3 items-end">
                        <div>
                            <label for="priceFilter" class="block text-xs text-slate-400 mb-1.5">Budget</label>
                            <select id="priceFilter" class="w-full md:w-auto min-w-[110px] px-2 py-1.5 text-xs rounded-md bg-slate-800 border border-slate-600 text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-300">
                                <option value="free" selected>Free</option>
                                <option value="paid">Paid</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1.5">Time Range</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" data-filter="this-week" class="filter-btn w-full px-3 py-2 text-xs bg-blue-100 text-slate-900 rounded-md font-medium hover:bg-blue-50 border border-blue-200 transition">This Week</button>
                                <button type="button" data-filter="today"     class="filter-btn w-full px-3 py-2 text-xs bg-slate-800 text-slate-300 rounded-md font-medium border border-slate-600 hover:bg-slate-700 transition">Today</button>
                                <button type="button" data-filter="next-week" class="filter-btn w-full px-3 py-2 text-xs bg-slate-800 text-slate-300 rounded-md font-medium border border-slate-600 hover:bg-slate-700 transition">Next Week</button>
                            </div>
                            <input type="hidden" id="dateFilter" value="this-week">
                        </div>
                    </div>
                </form>

                <div id="error" class="hidden mt-6 p-4 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm"></div>

                <div id="loading" class="hidden mt-8 text-center bg-slate-800/50 border border-slate-700 rounded-xl p-4 fade-in">
                    <div class="spinner w-10 h-10 border-4 border-slate-600 border-t-blue-500 rounded-full mx-auto mb-3"></div>
                    <p class="text-slate-400">Ranking events for you...</p>
                </div>

                <div id="result" class="hidden mt-8 space-y-4">
                    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                        <div>
                            <h2 class="text-xl font-semibold text-white">Top Matches</h2>
                            <p class="text-sm text-slate-400 mt-1" id="resultCount"></p>
                        </div>
                        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                            <div class="flex gap-2">
                                <button id="rankingsTab"  class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Rankings</button>
                                <button id="favoritesTab" class="px-4 py-2 text-sm font-medium bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition">★ <span id="favCount">0</span></button>
                            </div>
                            <select id="sortBy" class="px-3 py-2 text-sm bg-slate-700 text-slate-200 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-300">
                                <option value="score">Sort by Score</option>
                                <option value="price">Free First</option>
                                <option value="date">Soonest First</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-3"        id="resultContent"></div>
                    <div class="space-y-3 hidden" id="favoritesContent"></div>
                    <div id="infoBadge" class="mt-6 inline-block px-4 py-2 bg-blue-500/10 border border-blue-300/50 text-blue-200 rounded-lg text-sm font-medium"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function parseResults(text) {
        const events = [];
        const lines = text.split('\n').map(line => line.trim()).filter(line => line);
        let currentEvent = null;
        let skipUntilFirstEvent = true;
        for (const line of lines) {
            if (line.startsWith('Score:')) {
                if (currentEvent) {
                    const scoreMatch = line.match(/Score:\s*(\d+)\/10\s*\|\s*(FREE|PAID)/i);
                    if (scoreMatch) {
                        currentEvent.score = scoreMatch[1] + '/10';
                        currentEvent.isPaid = scoreMatch[2].toUpperCase() === 'PAID';
                        events.push(currentEvent);
                        skipUntilFirstEvent = false;
                    }
                }
                currentEvent = null;
            } else if (skipUntilFirstEvent && !line.match(/^[A-Z]/)) {
                continue;
            } else if (line.startsWith('REASON:')) {
                if (currentEvent) currentEvent.reason = line.replace('REASON:', '').trim();
            } else if (currentEvent === null && line && !line.includes('Score:')) {
                currentEvent = { name: line, description: '', reason: '', score: '?/10', isPaid: false };
            } else if (currentEvent && !line.startsWith('Score:') && !line.startsWith('REASON:') && line) {
                if (currentEvent.description) currentEvent.description += ' ' + line;
                else currentEvent.description = line;
            }
        }
        return events.slice(0, 6);
    }

    function setButtonGroupState(buttons, activeBtn) {
        buttons.forEach(btn => {
            btn.classList.remove("bg-blue-100", "border-blue-200", "text-slate-900");
            btn.classList.add("bg-slate-800", "text-slate-300", "border", "border-slate-600");
        });
        activeBtn.classList.remove("bg-slate-800", "text-slate-300", "border", "border-slate-600");
        activeBtn.classList.add("bg-blue-100", "border-blue-200", "text-slate-900");
    }

    const dateButtons = Array.from(document.querySelectorAll(".filter-btn"));
    dateButtons.forEach(btn => {
        btn.addEventListener("click", e => {
            e.preventDefault();
            setButtonGroupState(dateButtons, btn);
            document.getElementById("dateFilter").value = btn.getAttribute("data-filter");
        });
    });

    const goalsInput  = document.getElementById("goals");
    const voiceBtn    = document.getElementById("voiceBtn");
    const clearBtn    = document.getElementById("clearBtn");
    const submitBtn   = document.getElementById("submitBtn");
    const charCountEl = document.getElementById("charCount");
    const defaultSubmitText = submitBtn.textContent.trim();

    function updateInputState() {
        const len = goalsInput.value.trim().length;
        submitBtn.disabled = len < 3;
        clearBtn.disabled  = len === 0;
        charCountEl.textContent = len === 0 ? "" : `${len} characters`;
    }

    goalsInput.addEventListener("input", updateInputState);
    goalsInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!submitBtn.disabled) document.getElementById("goalForm").dispatchEvent(new Event("submit")); }
        if (e.key === "Escape") { goalsInput.value = ""; updateInputState(); goalsInput.focus(); }
    });
    clearBtn.addEventListener("click", () => { goalsInput.value = ""; updateInputState(); goalsInput.focus(); });

    function updateFavoriteCount() {
        const saved = JSON.parse(localStorage.getItem('savedEvents') || '{}');
        document.getElementById("favCount").textContent = Object.keys(saved).length;
    }
    updateFavoriteCount();

    function saveBtnHandler(e) {
        e.preventDefault();
        const eventId = this.getAttribute('data-event-id');
        const saved = JSON.parse(localStorage.getItem('savedEvents') || '{}');
        if (saved[eventId]) {
            delete saved[eventId];
            this.classList.remove('text-yellow-400'); this.classList.add('text-slate-500'); this.textContent = '☆';
        } else {
            saved[eventId] = true;
            this.classList.remove('text-slate-500'); this.classList.add('text-yellow-400'); this.textContent = '★';
        }
        localStorage.setItem('savedEvents', JSON.stringify(saved));
        updateFavoriteCount();
    }

    function attachSaveListeners() {
        document.querySelectorAll('.save-btn').forEach(btn => {
            btn.removeEventListener('click', saveBtnHandler);
            btn.addEventListener('click', saveBtnHandler);
        });
    }

    updateInputState();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null, isListening = false;
    if (!SpeechRecognition) {
        voiceBtn.disabled = true;
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US"; recognition.interimResults = true; recognition.continuous = false;
        recognition.addEventListener("start", () => { isListening = true; voiceBtn.classList.add("bg-blue-100","text-slate-900","border-blue-200","mic-listening"); });
        recognition.addEventListener("result", event => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) { if (event.results[i].isFinal) transcript += event.results[i][0].transcript; }
            if (transcript.trim()) { const cur = goalsInput.value.trim(); goalsInput.value = cur ? `${cur} ${transcript.trim()}` : transcript.trim(); updateInputState(); }
        });
        recognition.addEventListener("end",   () => { isListening = false; voiceBtn.classList.remove("bg-blue-100","text-slate-900","border-blue-200","mic-listening"); });
        recognition.addEventListener("error", () => { isListening = false; voiceBtn.classList.remove("bg-blue-100","text-slate-900","border-blue-200","mic-listening"); });
        voiceBtn.addEventListener("click", () => { if (!recognition) return; isListening ? recognition.stop() : recognition.start(); });
    }

    document.querySelectorAll(".preset-chip").forEach(chip => {
        chip.addEventListener("click", () => {
            const text = chip.getAttribute("data-text");
            const current = goalsInput.value.trim();
            goalsInput.value = current ? `${current}, ${text}` : text;
            updateInputState(); goalsInput.focus();
        });
    });

    function showLoading(show) { document.getElementById("loading").classList.toggle("hidden", !show); }
    function showError(msg) {
        const el = document.getElementById("error");
        if (msg) { el.textContent = msg; el.classList.remove("hidden"); }
        else      { el.classList.add("hidden"); }
    }

    document.getElementById("goalForm").addEventListener("submit", async e => {
        e.preventDefault();
        const goals       = goalsInput.value.trim();
        const dateFilter  = document.getElementById("dateFilter").value;
        const priceFilter = document.getElementById("priceFilter").value;
        if (!goals) { showError("Please enter what you're looking for"); return; }
        showLoading(true); showError("");
        submitBtn.disabled = true; submitBtn.classList.add("opacity-70","cursor-not-allowed"); submitBtn.textContent = "Finding...";

        try {
            const response = await fetch("/api/optimize", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ goals, dateFilter, priceFilter })
            });
            const data = await response.json();
            if (!response.ok) {
                showError(data.error || "Something went wrong");
                showLoading(false); submitBtn.disabled = false; submitBtn.classList.remove("opacity-70","cursor-not-allowed"); submitBtn.textContent = defaultSubmitText;
                return;
            }

            const rankedEvents = parseResults(data.ranking);
            const allEvents    = data.events || [];
            const savedEvents  = JSON.parse(localStorage.getItem('savedEvents') || '{}');
            window.currentRankedEvents = rankedEvents;
            window.currentAllEvents    = allEvents;

            function renderCards(eventsToRender) {
                if (eventsToRender.length === 0) return '<div class="text-center py-8 text-slate-400">No events found. Try adjusting your filters.</div>';
                return eventsToRender.map((event, index) => {
                    const scoreNum = parseInt(event.score);
                    let scoreBg = 'bg-orange-900/30 text-orange-300';
                    if (scoreNum >= 8) scoreBg = 'bg-green-900/30 text-green-300';
                    else if (scoreNum >= 6) scoreBg = 'bg-blue-900/30 text-blue-300';
                    const fullEvent = allEvents.find(e => e.name.toLowerCase() === event.name.toLowerCase());
                    const eventUrl  = fullEvent?.url || '';
                    const eventTime = fullEvent?.start || '';
                    const eventId   = event.name;
                    let timeStr = '';
                    if (eventTime) { const parts = eventTime.split(' '); timeStr = parts.length > 1 ? parts[1] : parts[0]; }
                    const isSaved = !!savedEvents[eventId];
                    return `
                        <div class="bg-slate-800/45 border border-slate-600/80 rounded-xl p-4 hover:bg-slate-800/70 transition">
                            <div class="flex gap-4">
                                <div class="text-xl font-semibold text-slate-300 flex-shrink-0 w-7">${index + 1}</div>
                                <div class="flex-1">
                                    <div class="flex justify-between items-start gap-2 mb-2">
                                        <h3 class="font-medium text-slate-100 text-[15px]">${escapeHtml(event.name)}</h3>
                                        <button class="save-btn text-xl flex-shrink-0 transition ${isSaved ? 'text-yellow-400' : 'text-slate-500 hover:text-slate-300'}" data-event-id="${escapeHtml(eventId)}" title="${isSaved ? 'Remove from favorites' : 'Save to favorites'}">${isSaved ? '★' : '☆'}</button>
                                    </div>
                                    ${event.reason ? `<p class="text-sm text-slate-300 mb-2">${escapeHtml(event.reason)}</p>` : ''}
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${scoreBg}">${event.score}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full ${event.isPaid ? 'bg-amber-900/30 text-amber-300' : 'bg-emerald-900/30 text-emerald-300'}">${event.isPaid ? 'PAID' : 'FREE'}</span>
                                        ${timeStr ? `<span class="text-xs text-slate-400">${escapeHtml(timeStr)}</span>` : ''}
                                        ${eventUrl ? `<a href="${eventUrl}" target="_blank" class="text-xs text-blue-400 hover:text-blue-300 transition ml-auto">Register →</a>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }).join('');
            }

            document.getElementById("resultContent").innerHTML = renderCards(rankedEvents);
            document.getElementById("resultCount").textContent  = `Found ${rankedEvents.length} events`;

            document.getElementById("sortBy").addEventListener("change", function() {
                let sorted = [...window.currentRankedEvents];
                if (this.value === "score") sorted.sort((a,b) => parseInt(b.score) - parseInt(a.score));
                else if (this.value === "price") sorted = sorted.filter(e => !e.isPaid).concat(sorted.filter(e => e.isPaid));
                else if (this.value === "date") sorted.sort((a,b) => { const aD = window.currentAllEvents.find(e=>e.name===a.name)?.start||""; const bD = window.currentAllEvents.find(e=>e.name===b.name)?.start||""; return aD.localeCompare(bD); });
                document.getElementById("resultContent").innerHTML = renderCards(sorted);
                attachSaveListeners();
            });

            document.getElementById("infoBadge").textContent = data.is_live ? `✓ Live events (${data.event_count} found)` : `Sample events (add API keys for live events)`;
            const resultEl = document.getElementById("result");
            resultEl.classList.remove("hidden"); resultEl.classList.add("slide-in");
            attachSaveListeners(); showLoading(false);
            submitBtn.disabled = false; submitBtn.classList.remove("opacity-70","cursor-not-allowed"); submitBtn.textContent = "Done";
            setTimeout(() => { submitBtn.textContent = defaultSubmitText; }, 800);
            setupTabs(data.events);
        } catch (error) {
            showError("Error: " + error.message);
            showLoading(false); submitBtn.disabled = false; submitBtn.classList.remove("opacity-70","cursor-not-allowed"); submitBtn.textContent = defaultSubmitText;
        }
    });

    function setupTabs(allEvents) {
        const rankingsTab    = document.getElementById('rankingsTab');
        const favoritesTab   = document.getElementById('favoritesTab');
        const resultContent  = document.getElementById('resultContent');
        const favoritesContent = document.getElementById('favoritesContent');
        rankingsTab.addEventListener('click', () => {
            resultContent.classList.remove('hidden'); favoritesContent.classList.add('hidden');
            rankingsTab.classList.add('bg-blue-600','text-white'); rankingsTab.classList.remove('bg-slate-700','text-slate-300');
            favoritesTab.classList.remove('bg-blue-600','text-white'); favoritesTab.classList.add('bg-slate-700','text-slate-300');
        });
        favoritesTab.addEventListener('click', () => {
            const saved = JSON.parse(localStorage.getItem('savedEvents') || '{}');
            const favoriteEvents = allEvents.filter(e => saved[e.name]);
            if (favoriteEvents.length === 0) {
                favoritesContent.innerHTML = '<p class="text-slate-400 text-center py-8">No favorites yet. Click the star to save events.</p>';
            } else {
                favoritesContent.innerHTML = favoriteEvents.map((event, index) => `
                    <div class="bg-slate-800/45 border border-slate-600/80 rounded-xl p-4 hover:bg-slate-800/70 transition">
                        <div class="flex gap-4">
                            <div class="text-xl font-semibold text-slate-300 flex-shrink-0 w-7">${index + 1}</div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <h3 class="font-medium text-slate-100 text-[15px]">${escapeHtml(event.name)}</h3>
                                    <button class="save-btn text-xl flex-shrink-0 transition text-yellow-400" data-event-id="${escapeHtml(event.name)}" title="Remove from favorites">★</button>
                                </div>
                                <div class="flex items-center gap-3 flex-wrap text-xs text-slate-400">
                                    <span>${escapeHtml(event.venue||'')}</span>
                                    <span>${escapeHtml(event.start||'')}</span>
                                    <span class="${event.is_free ? 'text-emerald-400' : 'text-amber-400'}">${event.is_free ? 'FREE' : 'PAID'}</span>
                                    ${event.url ? `<a href="${event.url}" target="_blank" class="text-blue-400 hover:text-blue-300">Register →</a>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>`).join('');
            }
            favoritesContent.classList.remove('hidden'); resultContent.classList.add('hidden');
            favoritesTab.classList.add('bg-blue-600','text-white'); favoritesTab.classList.remove('bg-slate-700','text-slate-300');
            rankingsTab.classList.remove('bg-blue-600','text-white'); rankingsTab.classList.add('bg-slate-700','text-slate-300');
            attachSaveListeners();
        });
    }
</script>
{% endblock %}
